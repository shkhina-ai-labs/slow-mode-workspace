[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slow-mode-workspace"
version = "0.0.1"
description = "Reference implementation of the Slow-Mode Workspace (SMW) — a Koopman-spectral instantiation of latent-memory Transformer architectures."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Shkhina AI Labs" },
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/shkhina-ai-labs/slow-mode-workspace"
Issues = "https://github.com/shkhina-ai-labs/slow-mode-workspace/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["smw*"]
